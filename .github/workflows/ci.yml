name: CI

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  validate:
    name: Valider le projet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      PUBLIC_SANITY_PROJECT_ID: xo2ahvjo
      PUBLIC_SANITY_DATASET: production
      # Build de vérification, jamais déployé : `pnpm validate` construit le
      # site pour le contrôler. Sans cette variable, le verrou de
      # `src/lib/seo/siteUrl.ts` ferait échouer l'étape — c'est son rôle, mais
      # ici la sortie ne part nulle part. Le build signale de lui-même qu'une
      # origine `localhost` ne doit pas être publiée.
      #
      # La vraie adresse se saisit dans la plateforme d'hébergement, pas ici.
      SITE_URL: http://localhost:4321

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Activer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false

      - name: Localiser le cache pnpm
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restaurer le cache pnpm
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Générer les types Sanity (TypeGen)
        run: pnpm sanity:typegen

      - name: Valider
        run: pnpm validate

      - name: Valider l’environnement de prévisualisation
        env:
          # Jeton FACTICE, et c'est le point : le build de prévisualisation ne
          # prérend aucune page, donc il n'adresse aucune requête à Sanity. Ce
          # jeton ne peut rien lire. Il sert uniquement de traceur —
          # `check-preview-bundle.mjs` vérifie que sa valeur exacte se trouve
          # dans le paquet serveur et dans AUCUN fichier servi au navigateur.
          #
          # Sans jeton, ce contrôle refuse de s'exécuter plutôt que de passer au
          # vert sans rien prouver.
          SANITY_API_READ_TOKEN: skCANARIJETONFACTICEDECONTROLEDEFUITE0000000000
          PUBLIC_SANITY_STUDIO_URL: http://localhost:3333
        run: pnpm validate:preview
